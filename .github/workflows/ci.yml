name: API CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Copy code from github onto the runner machine
    - uses: actions/checkout@v4

    # Set up python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # Install Dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[test]"

    # Run Tests
    - name: Run Tests
      env:
        JWT_KEY: "secret-dummy-key-for-the-github-actions-only"
        JWT_ALG: "HS256"
      run: |
       pytest
           
