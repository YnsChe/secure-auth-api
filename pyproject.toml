[project]
name = "secure-auth-api"
version = "0.1.0"
description = "A simple FastAPI-based authentication API using SQLite and Argon2."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]",
    "argon2-cffi==25.1.0",
    "PyJWT==2.13.0",
    "python-dotenv==1.2.2",
    "pydantic==2.13.4",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.fastapi]
entrypoint = "app.main:app"